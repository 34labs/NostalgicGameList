<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Submit Game - NGL</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <h1>NGL SUBMIT</h1>
        </header>

        <div class="content">
            <div class="form-container">
                <h3 style="margin-bottom:15px; border-bottom:2px solid #000; padding-bottom:5px;">> SUBMIT NEW TITLE
                </h3>
                <form action="https://formspree.io/f/myknkeee" method="POST" onsubmit="alert('GAME SUBMITTED TO QUEUE! THANK YOU.'); return false;">
                    <div class="form-group">
                        <label>Game Title:</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Platform:</label>
                        <select class="form-control">
                            <option>Android</option>
                            <option>iOS</option>
                            <option>Windows</option>
                            <option>Java Jar</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Category:</label>
                        <select class="form-control">
                            <option>RPG</option>
                            <option>Action</option>
                            <option>Adventure</option>
                            <option>Puzzle</option>
                            <option>Sports</option>
                            <option>Racing</option>
                            <option>Fighting</option>
                            <option>Strategy</option>
                            <option>Simulation</option>
                            <option>Arcade</option>
                            <option>Casual</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Download Link:</label>
                        <input type="url" class="form-control" placeholder="http://..." required>
                    </div>

                    <div class="form-group">
                        <label>Description:</label>
                        <textarea class="form-control" rows="4"></textarea>
                    </div>

                    <button type="submit" class="btn-submit">[ SEND DATA ]</button>
                    <button type="button" class="nav-btn" onclick="history.back()" style="float:right;">[ CANCEL
                        ]</button>
                </form>
            </div>
        </div>

        <div style="text-align:center; padding:10px;">
            <a href="../index.html">&lt; BACK TO HOME</a>
        </div>
    </div>
</body>

</html>
